name = "aiapp-api"
main = "src/index.ts"
compatibility_date = "2026-11-10"
workers_dev = true

# D1 database binding (apply schema.sql first):
#   wrangler d1 execute aiapp --file schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "aiapp"
database_id = "9c00a786-d95a-462d-9727-6654c2c38135"

# KV namespace — rate-limit counters (5 submissions/IP/day) + badge cache.
[[kv_namespaces]]
binding = "KV"
id = "ef9bd080547240b3a2cf7b274c35b745"

# Same-origin API + badges on aiapp.im (zone active in this account).
[[routes]]
pattern = "aiapp.im/api/*"
zone_name = "aiapp.im"
[[routes]]
pattern = "aiapp.im/badge/*"
zone_name = "aiapp.im"
