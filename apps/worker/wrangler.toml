name = "afr-api"
main = "src/index.ts"
compatibility_date = "2026-11-10"
workers_dev = true

# Daily cron (04:30 UTC): owner notifications and mail housekeeping.
# Every 10 minutes: confirmation poll of the torch/promo orders that live
# under the board merchants (their own AIPAY accounts, so the daily
# reconcile of the main merchant never sees them).
# Scan snapshots enter D1 through the pinned sync-site release workflow.
[triggers]
crons = ["30 4 * * *", "*/10 * * * *"]

# Required secrets — set per environment, values are never committed:
#   GITHUB_DISPATCH_TOKEN  token that can dispatch scan.yml (search-then-collect;
#                          if unset the API still queues requests and the daily
#                          scan.yml schedule picks them up; dispatch is deferred)
#     wrangler secret put GITHUB_DISPATCH_TOKEN
#   QUEUE_TOKEN           shared token the scan runner must present as the
#                          X-Queue-Token header when marking a queue item done
#     wrangler secret put QUEUE_TOKEN
#   AIPAY_API_KEY         merchant key; absent disables billing calls
#   AIPAY_WEBHOOK_SECRET  webhook secret; both credentials required, otherwise 503
#   AIPAY_RECONCILE_ENABLED  set to true explicitly to enable daily reconciliation
#                            (one page, at most 10 orders; off by default)
#     wrangler secret put AIPAY_API_KEY
#     wrangler secret put AIPAY_WEBHOOK_SECRET

# D1 database binding (apply schema.sql first):
#   wrangler d1 execute aiapp --file schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "aiapp"
database_id = "9c00a786-d95a-462d-9727-6654c2c38135"

# KV namespace — rate-limit counters (5 submissions/IP/day; on-demand scan
# requests: 10/IP/day, 1/domain/day, 50/day) + badge cache.
[[kv_namespaces]]
binding = "KV"
id = "ef9bd080547240b3a2cf7b274c35b745"

# Same-origin API + badges on afr.im (zone active in this account).
[[routes]]
pattern = "afr.im/api/*"
zone_name = "afr.im"
[[routes]]
pattern = "afr.im/badge/*"
zone_name = "afr.im"
[[routes]]
pattern = "afr.im/badge"
zone_name = "afr.im"
# M9 admin is handled by this Worker. Configure the administrator login secrets before activation.
[[routes]]
pattern = "afr.im/admin"
zone_name = "afr.im"
[[routes]]
pattern = "afr.im/admin/*"
zone_name = "afr.im"
# MCP endpoint — stateless JSON-RPC 2.0 over HTTP (POST /mcp)
[[routes]]
pattern = "afr.im/mcp*"
zone_name = "afr.im"
