name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 零依赖：AFR 引擎用 Node 原生 test runner + TS 类型剥离直接跑
      - name: AFR engine unit tests
        run: node --test packages/afr/test/*.test.ts
