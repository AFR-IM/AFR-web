name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero dependencies: the AFR engine runs with Node's built-in test runner + native TS type stripping
      - name: AFR engine unit tests
        run: node --test packages/afr/test/*.test.ts
