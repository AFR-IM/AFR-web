name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Root package and publishing-tool tests
        run: npm test
      - name: API Worker tests
        run: npm test --workspace apps/worker
      - name: Mail Worker tests
        run: node --test apps/mail-worker/test/*.test.ts
      - name: Check OpenAPI JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("apps/web/public/openapi.json", "utf8"))'
