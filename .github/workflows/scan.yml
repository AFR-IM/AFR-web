# Scan pipeline — daily Tranco top-1M segment crawl plus the on-demand submission queue.
# Daily mode walks the Tranco top 1M in 1000-domain segments: each run resolves
# segment_start = floor(collected / 1000) * 1000 from the data repo snapshots
# (or uses the manual `segment` input) and scans the next 1000 domains.
# Runs on GitHub-hosted runners (public repo = free unlimited).
# Schedule: daily 02:00 UTC; while expansion is paused, scheduled runs drain
# only the on-demand queue. Tranco segment advancement requires an explicit
# workflow_dispatch with mode=daily.
# Manual runs pick mode=daily (Tranco segment + queue drain) or mode=queue
# (on-demand queue only — exits quickly when the queue is empty).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATA_REPO_TOKEN  PAT that can check out / push AFR-IM/AFR-data and can
#                    open repository_dispatch on this repo (site rebuild).
#   QUEUE_TOKEN      shared token for POST /api/v1/queue/<domain>/done;
#                    must match the worker's QUEUE_TOKEN secret.
name: scan

on:
  workflow_dispatch:
    inputs:
      topN:
        description: "Legacy Tranco top-N count (daily runs scan fixed 1000-domain segments)"
        required: false
        default: "1000"
      mode:
        description: "queue = on-demand queue only; daily = advance Tranco segment (requires explicit approval)"
        required: false
        default: "queue"
        type: choice
        options:
          - queue
          - daily
      segment:
        description: "Tranco segment start override (mode=daily), e.g. 2000; leave empty to derive it from collected data"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

# One writer for the data repo at a time. The weekly rescan, the targeted
# rescans and this workflow all push snapshots to the same AFR-data branch;
# racing pushes make the later push fail and lose that run's work. Runs that
# wait here are not lost: a queued submission is only acknowledged after its
# snapshot reached the repo, so it is simply picked up by the next run.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Verify data repository credential owner
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          : "${GH_TOKEN:?DATA_REPO_TOKEN is required}"
          OWNER="$(gh api user --jq .login)"
          if [ "$OWNER" != 'AFR-IM' ]; then
            echo '::error::DATA_REPO_TOKEN does not belong to AFR-IM'
            exit 1
          fi

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: AFR-IM/AFR-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Daily schedule is queue-only while Tranco expansion is paused.
      # Advancing a Tranco segment requires an explicit manual mode=daily run.
      - name: Resolve run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE=queue
          else
            MODE="${INPUT_MODE:-queue}"
          fi
          case "$MODE" in
            daily|queue) ;;
            *) echo "::error::Invalid mode '$MODE' (expected: daily or queue)"; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # One shared date for every scan step in this run, so segment and queue
      # snapshots land in the same scans/YYYY/MM/DD directory even if the run
      # crosses UTC midnight (the site publishes the latest date that has data).
      - name: Resolve scan date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # ── mode=daily: Tranco top-1M segment flow (1000 domains per run) ──────
      # Each daily run advances one 1000-domain segment down the Tranco top 1M.
      # collected counts every snapshot JSON already stored in the data repo
      # (today's directory excluded, so reruns of the same run resolve the same
      # segment and stay idempotent); curated domains in the data slightly
      # inflate the count, which only shifts the window.

      - name: Resolve scan segment
        id: segment
        if: steps.mode.outputs.mode == 'daily'
        env:
          INPUT_SEGMENT: ${{ inputs.segment }}
          SCAN_DATE: ${{ steps.date.outputs.date }}
        run: |
          if [ -n "$INPUT_SEGMENT" ]; then
            if ! [[ "$INPUT_SEGMENT" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid segment '$INPUT_SEGMENT' (expected a non-negative integer)"
              exit 1
            fi
            SEGMENT_START="$INPUT_SEGMENT"
          elif [ -f data/scan-cursor.json ]; then
            # The explicit cursor: the highest Tranco rank the pipeline has
            # *attempted*. It used to be derived from the number of snapshot
            # files, but a rescan of an old site writes a second file and an
            # on-demand submission from a rank-500,000 site writes one too —
            # so the count ran ahead of the ranks and whole segments were
            # skipped. The fallback below keeps the old derivation for a repo
            # that has no cursor yet.
            #
            # The cursor is the *attempted* rank, not the *covered* rank: a
            # domain the scanner cannot reach (blocked, no DNS, a challenge
            # page) leaves a hole in the coverage and is retried by the
            # weekly rescan. Deriving it from the coverage would never move
            # past the first unreachable domain.
            SEGMENT_START="$(python3 -c "import json;print(int(json.load(open('data/scan-cursor.json'))['lastRank']))")"
          else
            TODAY_DIR="data/scans/${SCAN_DATE//-//}"
            COLLECTED=0
            if [ -d data/scans ]; then
              COLLECTED="$(find data/scans -mindepth 4 -maxdepth 4 -type f -name '*.json' ! -path "$TODAY_DIR/*" | wc -l | tr -d '[:space:]')"
            fi
            SEGMENT_START=$(( COLLECTED / 1000 * 1000 ))
          fi
          echo "Collected snapshots resolve to segment start ${SEGMENT_START} (window +1 .. +1000)"
          echo "start=$SEGMENT_START" >> "$GITHUB_OUTPUT"

      - name: Fetch Tranco top list
        if: steps.mode.outputs.mode == 'daily'
        id: tranco
        env:
          SEGMENT_START: ${{ steps.segment.outputs.start }}
          SCAN_DATE: ${{ steps.date.outputs.date }}
        run: |
          SEGMENT_START="${SEGMENT_START:-0}"
          SEGMENT_END=$((SEGMENT_START + 1000))
          if [ "$SEGMENT_START" -ge 100000 ]; then
            echo "Segment coverage complete: segment start ${SEGMENT_START} >= 100000"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL -o top-1m.csv.zip https://tranco-list.eu/top-1m.csv.zip
          unzip -o -q top-1m.csv.zip
          awk -F, -v s=$((SEGMENT_START + 1)) -v e="$SEGMENT_END" 'NR >= s && NR <= e { print $2 }' top-1m.csv > segment.txt
          # Skip domains already snapshotted: today's directory first, then the
          # previous day's directory (cheap guard against duplicate re-scans).
          DATE_DIR="data/scans/${SCAN_DATE//-//}"
          PREV_DATE="$(date -u -d "$SCAN_DATE -1 day" +%F)"
          PREV_DIR="data/scans/${PREV_DATE//-//}"
          : > scanned.txt
          for d in "$DATE_DIR" "$PREV_DIR"; do
            if [ -d "$d" ]; then
              find "$d" -maxdepth 1 -type f -name '*.json' -printf '%f\n' >> scanned.txt
            fi
          done
          sed 's/\.json$//' scanned.txt | grep . | sort -u > exclude.txt || true
          grep -F -x -v -f exclude.txt segment.txt > targets.txt || true
          SLICE_COUNT="$(grep -c . segment.txt || true)"
          COUNT="$(grep -c . targets.txt || true)"
          if [ "$COUNT" -eq 0 ]; then
            echo "Segment coverage complete: no new domains to scan in segment ${SEGMENT_START}-$((SEGMENT_END - 1))"
          fi
          echo "Segment ${SEGMENT_START}-$((SEGMENT_END - 1)): ${COUNT} new of ${SLICE_COUNT} listed"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Scan Tranco top list
        if: steps.mode.outputs.mode == 'daily' && fromJSON(steps.tranco.outputs.count || '0') > 0
        shell: bash # adds pipefail: a scanner crash must fail the step
        env:
          SCAN_DATE: ${{ steps.date.outputs.date }}
        run: |
          DATE_DIR="data/scans/${SCAN_DATE//-//}"
          mkdir -p "$DATE_DIR"
          node packages/scanner/src/cli.ts --file targets.txt --out "$DATE_DIR" --concurrency 5 | tee scan-summary.txt

      - name: Commit top list snapshots to data repo
        id: commit-topn
        if: steps.mode.outputs.mode == 'daily'
        env:
          SEGMENT: ${{ steps.segment.outputs.start }}
          TRANCO_COUNT: ${{ steps.tranco.outputs.count || '0' }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd data
          # The cursor advances only when the segment was really scanned —
          # a run that found no new domain must not claim the next ranks.
          if [ "${TRANCO_COUNT:-0}" -gt 0 ]; then
            python3 -c "import json,sys; json.dump({'lastRank': int(sys.argv[1]) + 1000, 'updatedAt': sys.argv[2]}, open('scan-cursor.json','w'), indent=1, ensure_ascii=False)" "$SEGMENT" "$(date -u +%F)"
            echo "scan cursor: last attempted Tranco rank = $(( SEGMENT + 1000 ))"
          fi
          git config user.name "afr-bot"
          git config user.email "dev@afr.im"
          # Redact secret-looking examples that target sites publish in their own
          # pages (GitHub push protection blocks pushes containing them).
          REDACT='s/r8_[A-Za-z0-9_-]{16,}/r8_[redacted]/g; s/sk-[A-Za-z0-9_-]{16,}/sk-[redacted]/g; s/ghp_[A-Za-z0-9]{20,}/ghp_[redacted]/g; s/AKIA[0-9A-Z]{16}/[redacted-key]/g; s/xox[baprs]-[A-Za-z0-9-]{10,}/[redacted]/g; s/AIza[0-9A-Za-z_-]{30,}/[redacted]/g'
          git status --porcelain | awk '{print $NF}' | grep '\.json$' | while read -r f; do
            [ -f "$f" ] && sed -E -i "$REDACT" "$f" || true
          done
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan $(date -u +%F) segment${SEGMENT}"
            git push
            # Dispatch INLINE right after a proven push. The old end-of-job
            # step used a cross-step `if` that silently evaluated false on
            # every scheduled run (3/3 daily runs missed the rebuild,
            # leaving static + D1 stale), while this step's own `if` (mode)
            # is demonstrably evaluated correctly. Failure here only warns:
            # sync-site also has a daily safety-net schedule.
            curl -fsS -X POST https://api.github.com/repos/AFR-IM/AFR-web/dispatches \
              -H "Authorization: Bearer ${DATA_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"event_type":"scan-done"}' \
              || echo "::warning::scan-done dispatch failed after topn push"
            echo "repository_dispatch scan-done sent (topn)"
          fi

      # ── on-demand queue (both modes) ───────────────────────────────────────
      # In mode=daily this runs AFTER the segment push, so overnight submissions
      # are drained in the same run instead of waiting for the next schedule.

      - name: Fetch on-demand queue
        id: queue
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if curl -fsSL https://afr.im/api/v1/queue -o queue.json; then
            jq -r '(if type == "array" then . elif type == "object" then (.items // []) else [] end)[]?
              | if type == "string" then . elif type == "object" then (.domain // empty) else empty end' \
              queue.json > queue-raw.txt
            grep -E '^[A-Za-z0-9.-]+$' queue-raw.txt | sort -u > queue.txt || true
          else
            if [ "$MODE" = "queue" ]; then
              echo "::error::Failed to fetch the on-demand queue"
              exit 1
            fi
            echo "::warning::Queue fetch failed - skipping the queue drain this run"
            : > queue.txt
          fi
          COUNT="$(grep -c . queue.txt || true)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Queue domains: $COUNT"

      - name: Scan on-demand queue
        if: fromJSON(steps.queue.outputs.count || '0') > 0
        shell: bash # adds pipefail: a scanner crash must fail the step
        env:
          SCAN_DATE: ${{ steps.date.outputs.date }}
        run: |
          DATE_DIR="data/scans/${SCAN_DATE//-//}"
          mkdir -p "$DATE_DIR"
          node packages/scanner/src/cli.ts --file queue.txt --out "$DATE_DIR" --success-file queue-success.txt --concurrency 5 | tee -a scan-summary.txt

      - name: Commit queue snapshots to data repo
        id: commit-queue
        if: fromJSON(steps.queue.outputs.count || '0') > 0
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd data
          [ -s ../queue-success.txt ] || exit 0
          git config user.name "afr-bot"
          git config user.email "dev@afr.im"
          # Redact secret-looking examples that target sites publish in their own
          # pages (GitHub push protection blocks pushes containing them).
          REDACT='s/r8_[A-Za-z0-9_-]{16,}/r8_[redacted]/g; s/sk-[A-Za-z0-9_-]{16,}/sk-[redacted]/g; s/ghp_[A-Za-z0-9]{20,}/ghp_[redacted]/g; s/AKIA[0-9A-Z]{16}/[redacted-key]/g; s/xox[baprs]-[A-Za-z0-9-]{10,}/[redacted]/g; s/AIza[0-9A-Za-z_-]{30,}/[redacted]/g'
          git status --porcelain | awk '{print $NF}' | grep '\.json$' | while read -r f; do
            [ -f "$f" ] && sed -E -i "$REDACT" "$f" || true
          done
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan $(date -u +%F) queue"
          fi
          # Push even if unchanged so a rerun can safely retry dispatch/ack.
          git push
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST https://api.github.com/repos/AFR-IM/AFR-web/dispatches \
            -H "Authorization: Bearer ${DATA_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"scan-done"}')" || STATUS=transport_error
          if [ "$STATUS" != 204 ]; then
            echo "::error::Queue snapshots were pushed, but rebuild dispatch failed ($STATUS); retaining queue items"
            exit 1
          fi
          echo "repository_dispatch accepted (queue, HTTP 204)"

      # Acknowledge only successfully written snapshots in the pushed commit.
      # Runs only after the data push succeeded (step-level success gate);
      # a failed callback keeps the item queued for the next run and fails
      # the job so a missing/rotated QUEUE_TOKEN stays visible.
      - name: Report queue scans as done
        if: fromJSON(steps.queue.outputs.count || '0') > 0
        env:
          QUEUE_TOKEN: ${{ secrets.QUEUE_TOKEN }}
          SCAN_DATE: ${{ steps.date.outputs.date }}
        run: |
          DATE_DIR="scans/${SCAN_DATE//-//}"
          FAILURES=0
          while IFS= read -r domain; do
            [ -n "$domain" ] || continue
            if ! git -C data cat-file -e "HEAD:${DATE_DIR}/${domain}.json"; then
              echo "::error::No pushed snapshot for ${domain}"
              FAILURES=$((FAILURES + 1))
              continue
            fi
            if curl -fsS -X POST "https://afr.im/api/v1/queue/${domain}/done" \
                -H "X-Queue-Token: ${QUEUE_TOKEN}" -o /dev/null; then
              echo "reported done: ${domain}"
            else
              echo "::warning::done callback failed for ${domain}"
              FAILURES=$((FAILURES + 1))
            fi
          done < queue-success.txt
          REQUESTED="$(grep -c . queue.txt || true)"
          WRITTEN="$(grep -c . queue-success.txt || true)"
          if [ "$WRITTEN" -ne "$REQUESTED" ]; then
            echo "::error::Wrote ${WRITTEN}/${REQUESTED} queue snapshots; failed items remain queued"
            exit 1
          fi
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::${FAILURES} done callback(s) failed"
            exit 1
          fi

      - name: Publish job summary
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SEGMENT: ${{ steps.segment.outputs.start }}
        run: |
          {
            echo "## AFR scan $(date -u +%F) - mode=${MODE:-?} (segment ${SEGMENT:-n/a})"
            echo '```'
            tail -n 8 scan-summary.txt 2>/dev/null || echo "scan output not available"
            echo '```'
            if [ -f queue.txt ]; then
              echo "Queue domains this run: $(grep -c . queue.txt || true)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Rebuild dispatch moved INLINE into the two commit steps above (right
      # after `git push`): this step's cross-step `if` silently evaluated
      # false on every scheduled run, so daily scans never rebuilt the site
      # (missed rebuilds on 11-13, 11-14 and 11-15). sync-site.yml also runs
      # on a daily schedule as a safety net.
