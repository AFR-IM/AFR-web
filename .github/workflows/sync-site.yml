# Static site rebuild + deploy, triggered when a scan finishes
# (repository_dispatch "scan-done" from scan.yml, sent after the data push)
# or run manually via workflow_dispatch.
#
# Flow: data checkout -> fetch-data -> sitemap -> npm ci -> astro build
#       -> wrangler deploy (static assets + routes for afr.im).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATA_REPO_TOKEN  PAT with read access to AFR-IM/AFR-data.
#   CF_API_TOKEN     Cloudflare API token used by wrangler deploy.
#   CF_ACCOUNT_ID    Cloudflare account id used by wrangler deploy.
name: sync-site

on:
  repository_dispatch:
    types: [scan-done]
  workflow_dispatch:
  # Safety net: rebuild even when a scan-done dispatch is missed (the old
  # cross-step dispatch condition in scan.yml skipped on scheduled runs).
  # The date-walk sync is idempotent (sha-skip), so a no-change rebuild is cheap.
  schedule:
    - cron: "0 6 * * *"

# One site build at a time: overlapping triggers queue instead of colliding
# mid-build / mid-deploy (a newer queued run always rebuilds from fresh data).
concurrency:
  group: sync-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 60 min: the D1 date-walk can page through ~1000 fresh snapshots
    # (~30 pages at 32/page) after a missed dispatch backfills a whole day.
    timeout-minutes: 60
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: AFR-IM/AFR-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build-time JSON payloads; the data repo is the single source of truth.
      # Script-relative paths, so it runs fine from the repo root.
      - name: Generate site data from the latest scans
        run: node apps/web/scripts/fetch-data.mjs --data-dir "${GITHUB_WORKSPACE}/data/scans"

      # Reads src/data/generated/details written by fetch-data -> must run after it.
      - name: Regenerate sitemap
        run: node apps/web/scripts/make-sitemap.mjs

      - name: Install dependencies
        run: npm ci

      # Per-site OG score cards (gitignored build artifacts) — must exist
      # before astro build: detail pages probe public/og/sites/<domain>.png to
      # choose the per-site card over the brand fallback.
      - name: Render Open Graph cards
        run: node apps/web/scripts/make-og-cards.mjs

      - name: Build site
        working-directory: apps/web
        run: npx astro build

      # Cards must leave the main Worker before deploy: Workers Free caps
      # 20,000 asset files per version and the bilingual detail pages already
      # use ~2N of it. They are moved out of dist (not filtered by
      # .assetsignore, which would leave the count unverifiable) and into the
      # separate afr-og Worker. Staging happens after the build so the
      # existsSync probe above still sees them.
      - name: Stage Open Graph cards for the afr-og Worker
        run: |
          set -euo pipefail
          rm -rf apps/og-worker/assets/og
          mkdir -p apps/og-worker/assets/og
          mv apps/web/dist/og/sites apps/og-worker/assets/og/sites
          cp apps/og-worker/headers.txt apps/og-worker/assets/_headers
          count=$(find apps/og-worker/assets/og/sites -type f -name '*.png' | wc -l)
          echo "staged ${count} OG cards for afr-og"
          test "$count" -gt 0
          if [ -e apps/web/dist/og/sites ]; then
            echo "::error::/og/sites still present in the main Worker assets"
            exit 1
          fi
          main=$(find apps/web/dist -type f ! -path '*/_worker.js/*' ! -name '_routes.json' | wc -l)
          echo "main Worker asset files: ${main}"
          test "$main" -lt 20000

      # Cards first: a detail page must never reference a card that is not
      # live yet. A missing card only costs the preview image, but deploy order
      # keeps the window at zero.
      - name: Deploy afr-og (per-site cards)
        working-directory: apps/og-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync D1 with the freshly published data
        env:
          QUEUE_TOKEN: ${{ secrets.QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          # Same snapshot set as the static build: publish, then sync D1.
          # Every date is walked (not just the newest) so a day whose sync
          # failed once is backfilled by the next run; each date is paged
          # because one Worker invocation may only fetch ~32 snapshots
          # (Cloudflare free-plan subrequest/CPU caps). nextOffset=null → done.
          # curl retries transient failures (connection resets and 5xx from
          # CPU-limit pages) — the endpoint is idempotent (sha-skip), so a
          # retry of the same offset resumes instead of duplicating work.
          dates=$(find data/scans -name '*.json' -printf '%h\n' | sed 's|data/scans/||' | sort -u)
          fail=0
          for date in $dates; do
            offset=0
            while :; do
              resp=$(curl -fsS --connect-timeout 20 --max-time 240 \
                --retry 6 --retry-delay 10 --retry-all-errors --retry-max-time 900 \
                -X POST https://afr.im/api/v1/_internal/sync \
                -H "X-Queue-Token: ${QUEUE_TOKEN}" \
                -H 'Content-Type: application/json' \
                -d "{\"date\":\"${date}\",\"offset\":${offset}}") || { echo "sync call failed for ${date}@${offset}"; fail=1; break; }
              echo "${date}@${offset}: ${resp}"
              next=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("nextOffset") or "")')
              [ -z "$next" ] && break
              offset=$next
            done
          done
          exit $fail
